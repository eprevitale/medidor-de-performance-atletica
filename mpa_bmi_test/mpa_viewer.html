<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MPA - Visualizador IMU</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #111;
    color: #eee;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr 1fr;
    gap: 8px;
    padding: 8px;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: #1c1c1c;
    border-radius: 8px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  button {
    background: #2a6df4;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { background: #444; cursor: not-allowed; }
  button.stop { background: #d33; }
  #status {
    margin-left: auto;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    background: #333;
  }
  #status.ok { background: #1e6b2e; }
  #status.err { background: #8b1e1e; }
  .panel {
    background: #1c1c1c;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel h2 {
    font-size: 12px;
    margin: 0 0 6px 0;
    font-weight: 600;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  canvas { width: 100%; flex: 1; display: block; background: #000; border-radius: 4px; }
  #diag {
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #ccc;
    overflow: auto;
    flex: 1;
  }
  #diag b { color: #6cf; }
  #cubeWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 600px;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
  }
  #cube {
    width: 120px;
    height: 120px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.05s linear;
  }
  .face {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 2px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    opacity: 0.85;
  }
  .face.front  { background: #2a6df4; transform: translateZ(60px); }
  .face.back   { background: #d33;    transform: rotateY(180deg) translateZ(60px); }
  .face.right  { background: #1e6b2e; transform: rotateY(90deg) translateZ(60px); }
  .face.left   { background: #b80;    transform: rotateY(-90deg) translateZ(60px); }
  .face.top    { background: #777;    transform: rotateX(90deg) translateZ(60px); }
  .face.bottom { background: #333;    transform: rotateX(-90deg) translateZ(60px); }
</style>
</head>
<body>

<header>
  <h1>MPA — Visualizador IMU</h1>
  <button id="btnConnect">Conectar</button>
  <button id="btnStart" disabled>Start</button>
  <button id="btnStop" class="stop" disabled>Stop</button>
  <span id="status">Desconectado</span>
</header>

<div class="panel">
  <h2>Acelerômetro (ax, ay, az)</h2>
  <canvas id="accCanvas"></canvas>
</div>

<div class="panel">
  <h2>Orientação (gravidade)</h2>
  <div id="cubeWrap">
    <div id="cube">
      <div class="face front">+X</div>
      <div class="face back">−X</div>
      <div class="face right">+Y</div>
      <div class="face left">−Y</div>
      <div class="face top">+Z</div>
      <div class="face bottom">−Z</div>
    </div>
  </div>
</div>

<div class="panel">
  <h2>Giroscópio (gx, gy, gz)</h2>
  <canvas id="gyrCanvas"></canvas>
</div>

<div class="panel">
  <h2>Magnitude da aceleração + Diagnóstico</h2>
  <canvas id="magCanvas" style="flex:1; margin-bottom:6px;"></canvas>
  <div id="diag">
    <div>Batches: <b id="dBatches">0</b></div>
    <div>Amostras: <b id="dSamples">0</b></div>
    <div>Taxa: <b id="dRate">0</b> amostras/s</div>
    <div>Perdidos: <b id="dLost">0</b></div>
    <div>Última amostra:</div>
    <div>t=<b id="dT">0</b> seq=<b id="dSeq">0</b></div>
    <div>ax=<b id="dAx">0</b> ay=<b id="dAy">0</b> az=<b id="dAz">0</b></div>
    <div>gx=<b id="dGx">0</b> gy=<b id="dGy">0</b> gz=<b id="dGz">0</b></div>
  </div>
</div>

<script>
// ============================================================
// UUIDs (do firmware mpa_src.ino)
// ============================================================
const UUID_SUFFIX = "-8f3a-4c1e-9b7a-0a1b2c3d4e5f";
const SVC_PROV_UUID   = "6d500010" + UUID_SUFFIX;
const CHR_CMD_UUID    = "6d500011" + UUID_SUFFIX;
const CHR_STATUS_UUID = "6d500012" + UUID_SUFFIX;
const SVC_DATA_UUID   = "6d500020" + UUID_SUFFIX;
const CHR_IMU_UUID    = "6d500021" + UUID_SUFFIX;

// ============================================================
// Configuração de visualização
// ============================================================
const DOWNSAMPLE = 10;        // 1 amostra a cada 10 (400Hz -> 40Hz de plot)
const MAX_POINTS = 400;       // pontos visíveis por gráfico (~10s a 40Hz)
const BATCH_HEADER = 3;       // uint16 + uint8
const SAMPLE_SIZE  = 18;      // bytes por ImuSample

// ============================================================
// Estado
// ============================================================
let device = null;
let server = null;
let chCmd = null, chStatus = null, chImu = null;
let streaming = false;
let imuError = false;         // true se o firmware avisou "imu_error"

let sampleCounter = 0;        // conta amostras recebidas (para downsample)
let totalSamples = 0;
let totalBatches = 0;
let lostBatches = 0;
let lastBatchSeq = -1;
let rateWindow = [];          // timestamps para calcular taxa
let lastSample = null;

// Buffers circulares para os gráficos
const accBuf = { ax: [], ay: [], az: [] };
const gyrBuf = { gx: [], gy: [], gz: [] };
const magBuf = [];

// ============================================================
// Log / status
// ============================================================
const statusEl = document.getElementById("status");
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

// ============================================================
// Gráficos em canvas puro
// ============================================================
function setupCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}

function drawLines(canvas, series, colors, yMin, yMax, labels) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
    canvas.width  = rect.width  * dpr;
    canvas.height = rect.height * dpr;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = rect.width, h = rect.height;

  ctx.clearRect(0, 0, w, h);

  // grade
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    const y = (h / 5) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  // linha do zero
  const zeroY = h - ((0 - yMin) / (yMax - yMin)) * h;
  ctx.strokeStyle = "#444";
  ctx.beginPath();
  ctx.moveTo(0, zeroY);
  ctx.lineTo(w, zeroY);
  ctx.stroke();

  const range = yMax - yMin;
  const n = series[0].length;
  if (n < 2) return;

  for (let s = 0; s < series.length; s++) {
    ctx.strokeStyle = colors[s];
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = (i / (MAX_POINTS - 1)) * w;
      const v = series[s][i];
      const y = h - ((v - yMin) / range) * h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // legenda
  if (labels) {
    ctx.font = "11px monospace";
    for (let i = 0; i < labels.length; i++) {
      ctx.fillStyle = colors[i];
      ctx.fillText(labels[i], 6 + i * 60, 14);
    }
  }

  // escala
  ctx.fillStyle = "#888";
  ctx.font = "10px monospace";
  ctx.fillText(yMax.toFixed(0), 4, 10);
  ctx.fillText(yMin.toFixed(0), 4, h - 4);
}

// ============================================================
// Cubo 3D (CSS transforms)
// ============================================================
const cubeEl = document.getElementById("cube");
let smoothQuat = null; // não usado, mas mantido para futura suavização

function updateCube(ax, ay, az) {
  // Estima orientação a partir do vetor de gravidade
  // Normaliza
  const g = Math.sqrt(ax*ax + ay*ay + az*az) || 1;
  const gx = ax / g, gy = ay / g, gz = az / g;

  // Calcula ângulos de inclinação
  // roll (rotação em X), pitch (rotação em Y)
  const pitch = Math.asin(-gx) * 180 / Math.PI;
  const roll  = Math.atan2(gy, gz) * 180 / Math.PI;

  cubeEl.style.transform = `rotateX(${roll}deg) rotateY(${pitch}deg)`;
}

// ============================================================
// Parse do batch BLE
// ============================================================
function parseBatch(dataView) {
  const batchSeq = dataView.getUint16(0, true);
  const count = dataView.getUint8(2);

  // Pacote truncado (MTU negociado menor que o necessário): evita RangeError
  const needed = BATCH_HEADER + count * SAMPLE_SIZE;
  if (dataView.byteLength < needed) {
    setStatus(`Pacote truncado (${dataView.byteLength}/${needed} bytes): MTU baixo`, "err");
    return;
  }

  // Detecta pacotes perdidos
  if (lastBatchSeq >= 0) {
    const expected = (lastBatchSeq + 1) & 0xFFFF;
    if (batchSeq !== expected) {
      const diff = (batchSeq - expected + 0x10000) & 0xFFFF;
      lostBatches += diff;
    }
  }
  lastBatchSeq = batchSeq;
  totalBatches++;

  // Processa cada amostra
  let offset = BATCH_HEADER;
  for (let i = 0; i < count; i++) {
    const t_ms = dataView.getUint32(offset, true);
    const seq  = dataView.getUint16(offset + 4, true);
    const ax   = dataView.getInt16(offset + 6, true);
    const ay   = dataView.getInt16(offset + 8, true);
    const az   = dataView.getInt16(offset + 10, true);
    const gx   = dataView.getInt16(offset + 12, true);
    const gy   = dataView.getInt16(offset + 14, true);
    const gz   = dataView.getInt16(offset + 16, true);
    offset += SAMPLE_SIZE;

    totalSamples++;
    lastSample = { t_ms, seq, ax, ay, az, gx, gy, gz };

    // Downsample para visualização
    sampleCounter++;
    if (sampleCounter >= DOWNSAMPLE) {
      sampleCounter = 0;
      pushSample(lastSample);
    }
  }

  updateDiag();
}

function pushSample(s) {
  accBuf.ax.push(s.ax); accBuf.ay.push(s.ay); accBuf.az.push(s.az);
  gyrBuf.gx.push(s.gx); gyrBuf.gy.push(s.gy); gyrBuf.gz.push(s.gz);
  const mag = Math.sqrt(s.ax*s.ax + s.ay*s.ay + s.az*s.az);
  magBuf.push(mag);

  if (accBuf.ax.length > MAX_POINTS) {
    accBuf.ax.shift(); accBuf.ay.shift(); accBuf.az.shift();
    gyrBuf.gx.shift(); gyrBuf.gy.shift(); gyrBuf.gz.shift();
    magBuf.shift();
  }
}

// ============================================================
// Atualização dos gráficos
// ============================================================
function render() {
  if (lastSample) {
    drawLines(
      document.getElementById("accCanvas"),
      [accBuf.ax, accBuf.ay, accBuf.az],
      ["#f44", "#4f4", "#48f"],
      -20000, 20000,
      ["ax", "ay", "az"]
    );

    drawLines(
      document.getElementById("gyrCanvas"),
      [gyrBuf.gx, gyrBuf.gy, gyrBuf.gz],
      ["#f44", "#4f4", "#48f"],
      -32768, 32767,
      ["gx", "gy", "gz"]
    );

    drawLines(
      document.getElementById("magCanvas"),
      [magBuf],
      ["#fc4"],
      0, 25000,
      ["|a|"]
    );

    updateCube(lastSample.ax, lastSample.ay, lastSample.az);
  }
  requestAnimationFrame(render);
}

// ============================================================
// Diagnóstico
// ============================================================
function updateDiag() {
  // Calcula taxa numa janela de 1s
  const now = performance.now();
  rateWindow.push({ t: now, n: totalSamples });
  while (rateWindow.length > 0 && now - rateWindow[0].t > 1000) {
    rateWindow.shift();
  }
  let rate = 0;
  if (rateWindow.length >= 2) {
    const first = rateWindow[0];
    const last = rateWindow[rateWindow.length - 1];
    const dt = (last.t - first.t) / 1000;
    if (dt > 0) rate = Math.round((last.n - first.n) / dt);
  }

  document.getElementById("dBatches").textContent = totalBatches;
  document.getElementById("dSamples").textContent = totalSamples;
  document.getElementById("dRate").textContent = rate;
  document.getElementById("dLost").textContent = lostBatches;

  if (lastSample) {
    document.getElementById("dT").textContent = lastSample.t_ms;
    document.getElementById("dSeq").textContent = lastSample.seq;
    document.getElementById("dAx").textContent = lastSample.ax;
    document.getElementById("dAy").textContent = lastSample.ay;
    document.getElementById("dAz").textContent = lastSample.az;
    document.getElementById("dGx").textContent = lastSample.gx;
    document.getElementById("dGy").textContent = lastSample.gy;
    document.getElementById("dGz").textContent = lastSample.gz;
  }
}

// ============================================================
// Web Bluetooth
// ============================================================
async function connect() {
  try {
    setStatus("Solicitando dispositivo...");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC_PROV_UUID] }],
      optionalServices: [SVC_DATA_UUID]
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);

    setStatus("Conectando GATT...");
    server = await device.gatt.connect();

    const provSvc = await server.getPrimaryService(SVC_PROV_UUID);
    chCmd    = await provSvc.getCharacteristic(CHR_CMD_UUID);
    chStatus = await provSvc.getCharacteristic(CHR_STATUS_UUID);

    await chStatus.startNotifications();
    chStatus.addEventListener("characteristicvaluechanged", (e) => {
      const txt = new TextDecoder().decode(e.target.value);
      console.log("[status]", txt);
      if (txt === "imu_error") {
        imuError = true;
        streaming = false;
        setStatus("Erro: IMU não inicializou (veja o Serial)", "err");
        document.getElementById("btnStart").disabled = false;
        document.getElementById("btnStop").disabled = true;
      }
    });

    const dataSvc = await server.getPrimaryService(SVC_DATA_UUID);
    chImu = await dataSvc.getCharacteristic(CHR_IMU_UUID);
    await chImu.startNotifications();
    chImu.addEventListener("characteristicvaluechanged", (e) => {
      parseBatch(e.target.value);
    });

    setStatus("Conectado: " + device.name, "ok");
    document.getElementById("btnStart").disabled = false;
  } catch (err) {
    console.error(err);
    setStatus("Erro: " + err.message, "err");
  }
}

function onDisconnected() {
  setStatus("Desconectado");
  document.getElementById("btnStart").disabled = true;
  document.getElementById("btnStop").disabled = true;
  streaming = false;
}

async function startStream() {
  if (!chCmd) return;
  try {
    // O firmware zera batchSeq/sampleSeq no start: zera também os contadores daqui
    imuError = false;
    lastBatchSeq = -1;
    sampleCounter = 0;
    totalSamples = 0;
    totalBatches = 0;
    lostBatches = 0;
    rateWindow = [];
    for (const k in accBuf) accBuf[k].length = 0;
    for (const k in gyrBuf) gyrBuf[k].length = 0;
    magBuf.length = 0;

    await chCmd.writeValue(new TextEncoder().encode("start"));
    if (imuError) return;   // firmware recusou o start (já tratado no handler de status)
    streaming = true;
    document.getElementById("btnStart").disabled = true;
    document.getElementById("btnStop").disabled = false;
    setStatus("Streaming ativo", "ok");
  } catch (err) {
    console.error(err);
    setStatus("Erro ao iniciar: " + err.message, "err");
  }
}

async function stopStream() {
  if (!chCmd) return;
  try {
    await chCmd.writeValue(new TextEncoder().encode("stop"));
    streaming = false;
    document.getElementById("btnStart").disabled = false;
    document.getElementById("btnStop").disabled = true;
    setStatus("Stream parado");
  } catch (err) {
    console.error(err);
    setStatus("Erro ao parar: " + err.message, "err");
  }
}

// ============================================================
// Setup
// ============================================================
document.getElementById("btnConnect").addEventListener("click", connect);
document.getElementById("btnStart").addEventListener("click", startStream);
document.getElementById("btnStop").addEventListener("click", stopStream);

if (!navigator.bluetooth) {
  setStatus("Web Bluetooth não disponível. Use Chrome em localhost.", "err");
  document.getElementById("btnConnect").disabled = true;
} else {
  render();
}
</script>

</body>
</html>
